      - label: PhD students (co-supervisor)
        details: Max Charles (2023-), Hugh McDougall (2022-), Hayden Greer (2026-), Milo Langker (2026-), Jian Wang (2025-), Jonatan Rudrasingam (2025-)
     
      - label: Masters students
        details: Fareeha Almas (2024), Ryan White (2025), Cathy Liu (2025), Jonah Goldfine (2026)
      
      - label: Honours students
        details: Mark Edwards (2020), Alison Wong (2020), Louis Desdoigts (2021), Hugh McDougall (2023), Katelyn Smith (2024-2025), Ryan White (2024), Sascha Lawton (2024)
      
      - label: Undergraduate students
        details: Utkarsh Sharma (2022-23), Qingyuan Zhang (2021-2023), Jordan Dennis (2022-2023), 
          Ryan White (2023-2024), Hayden Greer (2024-2025), Ngoc Nhat Pham (2026).

    Service & Leadership:
      - label: Refereeing
        details: ApJ, MNRAS, A&A, PASA, *Nature* family, JOSS, JOSA. ASA & university prizes. 2 PhD theses, multiple Master's and Honours.
      - label: Proposal Reviewing
        details: Reviewer for ARC, NASA (Keck, HST, JWST, FINESST), NSF, STFC, EU grants and telescope proposals.
      - label: Leadership
        details: Co-Chair, Stellar and Planetary Research in Greater Sydney (SPRIGS). 
          Higher Degree by Research Coordinator, MQ School of Mathematical and Physical Sciences (MAPS; 2026-).
      - label: Conference Organization
        details: SOC Chair, 2024 and 2025 Australian Exoplanet Workshops (Brisbane, Newcastle). 
          SOC member for 2023 Australian Exoplanet Workshop. 2026 Astronomical Society of Australia Annual Scientific Meeting (ANU); 
          Life around a Radio Star (2022, Leiden); Royal Society *Radiocarbon and cosmic radiation events* 
          Meeting (2025, Edinburgh).
      - label: Committee Service
        details: Astronomical Society of Australia Stellar & Planetary Astronomy chapter committee (2025-). 
          Chair, Reconciliation Action Plan Committee, UQ School of Mathematics and Physics (SMP; 2022-2024); 
          Chair, UQ SMP Early & Mid-Career Academic committee (2022-2024); 
          member, UQ SMP Equity, Diversity, and Inclusion Committee (2022-2024).
          MQ MAPS Research Training Committee (2025-).

    Selected Synergistic Activities:
      - label: Open-Source Software
        details: halophot (enhancing dynamic range of Kepler/TESS), dLux (differentiable JAX physical optics), ticktack (Bayesian radiocarbon modelling)
      
      - label: Research impact
        details: 13 first-author papers; 53 co-authored; ~1900 citations; h-index 23. Published in *Nature*, *Nature Astronomy*, ApJ, MNRAS, A&A, *Proc. Royal Society A*." 

      - label: Media
        details: Science writing in *The Monthly*, *The Conversation*, *Cooper Square Review*, *Oxonian Review*, *Best Australian Science Writing 2021*. Media comment via ABC, *Guardian*, NYT, *Sydney Morning Herald*. Science Consultant for *War of the Worlds* (TV series), winning team member for *University Challenge* (BBC, 2017).

      - label: Public Engagement
        details: Sold-out performances for Pint of Science (Brisbane, Sydney), World Science Festival at QPAC, Caveat NYC science comedy, and Astronomy on Tap Brooklyn. Lead organizer of public telescope viewings of eclipses and the Transits of Venus and Mercury in Sydney, New York,  Oxford, and Brisbane. Telescope guide at Uluru, Stargazing Oxford, and PopScope DC and Baltimore.

